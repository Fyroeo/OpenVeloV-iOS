name: OpenVeloV
options:
  bundleIdPrefix: net.socialeo
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  VLSKit:
    path: ../VLSKit

targets:
  OpenVeloV:
    type: application
    platform: iOS
    sources:
      - path: OpenVeloVApp
      - path: Shared
    dependencies:
      - package: VLSKit
        product: VLSKit
      - package: VLSKit
        product: VLSKitUI
      - target: TripLiveActivityExtension
        embed: true
      - target: OpenVeloVWatch
        embed: true
    # Pulls in Config/Secrets.xcconfig when it exists; the build works without it.
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.socialeo.openvelov
        PRODUCT_NAME: OpenVeloV
        SWIFT_VERSION: "5.9"
        SWIFT_EMIT_LOC_STRINGS: YES
        MARKETING_VERSION: "0.4.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: OpenVeloVApp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 2MDRGC529Z
  TripLiveActivityExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: TripLiveActivityExtension
      - path: Shared
    dependencies:
      # The station widget reads GBFS directly, so it needs no account and no API key.
      - package: VLSKit
        product: VLSKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.socialeo.openvelov.TripLiveActivityExtension
        PRODUCT_NAME: TripLiveActivityExtension
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "0.4.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: TripLiveActivityExtension/Info.plist
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 2MDRGC529Z
  OpenVeloVWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: OpenVeloVWatch
      - path: OpenVeloVWatchShared
      # Shared message vocabulary, compiled into both the phone and watch so they can't drift.
      - path: Shared/WatchLink.swift
    dependencies:
      # GBFS is public, so the watch app needs no account and no API key.
      - package: VLSKit
        product: VLSKit
      - target: OpenVeloVWatchWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.socialeo.openvelov.watchkitapp
        PRODUCT_NAME: OpenVeloV
        SWIFT_VERSION: "5.9"
        SWIFT_EMIT_LOC_STRINGS: YES
        MARKETING_VERSION: "0.4.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: OpenVeloVWatch/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 2MDRGC529Z
  OpenVeloVWatchWidget:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: OpenVeloVWatchWidget
      - path: OpenVeloVWatchShared
    dependencies:
      - package: VLSKit
        product: VLSKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.socialeo.openvelov.watchkitapp.widget
        PRODUCT_NAME: OpenVeloVWatchWidget
        SWIFT_VERSION: "5.9"
        SWIFT_EMIT_LOC_STRINGS: YES
        MARKETING_VERSION: "0.4.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: OpenVeloVWatchWidget/Info.plist
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 2MDRGC529Z
  OpenVeloVTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OpenVeloVTests
    dependencies:
      - target: OpenVeloV
      - package: VLSKit
        product: VLSKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.socialeo.openvelov.tests
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 2MDRGC529Z
schemes:
  OpenVeloV:
    build:
      targets:
        OpenVeloV: all
        OpenVeloVTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - OpenVeloVTests
    archive:
      config: Release
  OpenVeloVWatch:
    build:
      targets:
        OpenVeloVWatch: all
    run:
      config: Debug
    archive:
      config: Release
  OpenVeloVWatchWidget:
    build:
      targets:
        OpenVeloVWatchWidget: all
    run:
      config: Debug
    archive:
      config: Release
